<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>모래사장과 얕은 바다 · 독립 그래픽 에셋</title>
<style>body{margin:0;background:#f3f6ef;color:#24392b;font:16px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{margin:0}header{margin-bottom:24px}button,a{font:inherit}button{border:1px solid #9cafa0;border-radius:9px;padding:8px 14px;background:white;cursor:pointer;margin:3px}section{margin:28px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}figure{margin:0;background:white;border:1px solid #d5dfd5;border-radius:12px;overflow:hidden}figure img{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:contain;background-color:var(--bg,#e5e8e6);background-image:var(--pattern,conic-gradient(#fff 25%,#e5e8e6 0 50%,#fff 0 75%,#e5e8e6 0));background-size:20px 20px}figcaption{padding:12px;overflow-wrap:anywhere}small{display:block;color:#536b59}.background{max-width:1100px}.background img{background:white}a{color:#246347}#status{white-space:pre-wrap}</style>
<main><header><h1>모래사장과 얕은 바다 · 독립 그래픽 에셋</h1><p><a href="../../editor/?theme=sea">🌊 바다 배경에 에셋 직접 배치하기</a></p><p>배경과 각 오브젝트는 별도 PNG 파일입니다. 아래 체크무늬는 투명도를 확인하기 위한 화면 표시이며 파일에 포함되지 않습니다.</p><p><a href="../sea-01.zip" download>전체 에셋 ZIP 다운로드</a></p><div>투명 영역 확인: <button data-bg="check">체크무늬</button><button data-bg="#ffffff">흰색</button><button data-bg="#24302b">어두운색</button><button data-bg="#ee78ba">분홍색</button></div><p id="status">목록을 불러오는 중…</p></header><div id="assets"></div></main>
<script type="module">
const root=document.documentElement;document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{root.style.setProperty('--pattern',b.dataset.bg==='check'?'conic-gradient(#fff 25%,#e5e8e6 0 50%,#fff 0 75%,#e5e8e6 0)':'none');root.style.setProperty('--bg',b.dataset.bg==='check'?'#e5e8e6':b.dataset.bg);});
try{const response=await fetch('./manifest.json');if(!response.ok)throw Error('목록을 불러오지 못했습니다.');const manifest=await response.json();document.querySelector('#status').textContent=manifest.summary;const labels={background:'모래사장과 얕은 바다 기본 배경',palms:'야자수',rocks:'해안 바위',plants:'해안 풀',shells:'조개·불가사리',corals:'얕은 바다 산호',fish:'일반 물고기',props:'통나무·작은 배'};for(const [category,label] of Object.entries(labels)){const entries=manifest.assets.filter(a=>a.category===category);if(!entries.length)continue;const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=label;section.append(heading);const grid=document.createElement('div');grid.className=category==='background'?'background':'grid';for(const asset of entries){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption'),link=document.createElement('a'),info=document.createElement('small');img.src='./'+asset.file;img.alt=asset.label??asset.id;img.loading='lazy';link.href='./'+asset.file;link.textContent=asset.label??asset.file;link.target='_blank';link.rel='noopener';info.textContent=`${asset.width}×${asset.height}px · ${asset.transparent?'투명 PNG':'불투명 배경'}${asset.reviewRequired?' · 추가 검수 필요':''}`;caption.append(link,info);figure.append(img,caption);grid.append(figure)}section.append(grid);document.querySelector('#assets').append(section)}}catch(e){document.querySelector('#status').textContent=e.message;}
</script></html>
